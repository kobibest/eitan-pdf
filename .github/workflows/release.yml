# בונה את תוכנת ההתקנה ומפרסם אותה ב-Releases בכל פעם שמספר הגרסה ב-package.json משתנה.
# הקישור הקבוע להורדה של הגרסה האחרונה:
#   https://github.com/kobibest/eitan-pdf/releases/latest/download/EitanPDF-Setup-x64.exe
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Build installer
        if: steps.v.outputs.exists == 'false'
        run: |
          npm ci
          npm test
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          installer/build.sh x64
          cp "dist/EitanPDF-Setup-${{ steps.v.outputs.version }}-x64.exe" dist/EitanPDF-Setup-x64.exe

      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: איתןPDF ${{ steps.v.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/EitanPDF-Setup-x64.exe
            dist/EitanPDF-Setup-${{ steps.v.outputs.version }}-x64.exe
