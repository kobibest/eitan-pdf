<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' data: blob: http://localhost https://localhost">
  <meta name="theme-color" content="#0B2A82">
  <title>איתןPDF</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- מסך הבית -->
  <section class="screen home" id="home">
    <div class="home-hero">
      <img class="home-logo" src="img/logo.png" alt="">
      <h1 class="home-name">איתן<span>PDF</span></h1>
      <p class="home-tag">עבודה עם PDF בעברית. חינמי, ושום קובץ לא יוצא מהטלפון.</p>
    </div>
    <div class="home-body">
      <button class="btn-gold btn-big" id="btn-open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        פתיחת קובץ PDF
      </button>
      <p class="home-hint">אפשר גם לפתוח קובץ ישר מוואטסאפ, מג׳ימייל או מאפליקציית הקבצים: בוחרים <b>פתח באמצעות</b> או <b>שתף</b>, ואז <b>איתןPDF</b>.</p>
    </div>
    <footer class="home-foot">
      <button class="link" id="btn-about">אודות</button>
    </footer>
  </section>

  <!-- צפייה -->
  <section class="screen viewer" id="viewer" hidden>
    <header class="appbar">
      <button class="icon-btn" id="btn-close" aria-label="סגירת הקובץ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="appbar-title">
        <div class="doc-name" id="doc-name"></div>
        <div class="doc-sub" id="doc-sub"></div>
      </div>
      <button class="icon-btn" id="btn-menu" aria-label="עוד">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
    </header>
    <div class="scroller" id="scroller">
      <div class="pages" id="pages"></div>
    </div>
    <button class="page-pill" id="page-pill" aria-label="מעבר לעמוד"></button>
    <nav class="toolbar" id="viewer-toolbar" aria-label="כלים">
      <button class="tb" id="tb-pages"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="9" rx="1"/><rect x="13.5" y="3" width="7.5" height="9" rx="1"/><rect x="3" y="15" width="7.5" height="6" rx="1"/><rect x="13.5" y="15" width="7.5" height="6" rx="1"/></svg><span>עמודים</span></button>
      <button class="tb" id="tb-add"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M12.5 10.5v7M9 14h7"/></svg><span>הוספת קובץ</span></button>
      <button class="tb" id="tb-share"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span>שיתוף</span></button>
      <button class="tb tb-save" id="tb-save"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span>שמירה</span><i class="dirty-dot" aria-hidden="true"></i></button>
    </nav>
  </section>

  <!-- עמודים -->
  <section class="screen pages-screen" id="pages-screen" hidden>
    <header class="appbar">
      <button class="icon-btn" id="btn-pages-done" aria-label="סיום">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="appbar-title">
        <div class="doc-name">עמודים</div>
        <div class="doc-sub" id="pages-sub">לחיצה ארוכה וגרירה לסידור · הקשה לבחירה</div>
      </div>
      <button class="icon-btn" id="btn-undo" aria-label="ביטול הפעולה האחרונה" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 7H9.5A4.5 4.5 0 0 0 5 11.5v0A4.5 4.5 0 0 0 9.5 16H17"/><path d="M12 4l3 3-3 3"/></svg>
      </button>
    </header>
    <div class="grid-scroller" id="grid-scroller">
      <div class="grid" id="grid"></div>
    </div>
    <nav class="toolbar" id="pages-toolbar" aria-label="פעולות על עמודים">
      <div class="tb-group" id="tb-none">
        <button class="tb" id="pg-add"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M12.5 10.5v7M9 14h7"/></svg><span>הוספת קובץ</span></button>
        <button class="tb" id="pg-split"><svg viewBox="0 0 24 24"><path d="M4 4h7v16H4zM13 4h7v16h-7z"/><path d="M12 2v20" stroke-dasharray="2 2"/></svg><span>פיצול</span></button>
        <button class="tb" id="pg-all"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7.5 12.5l3 3 6-7"/></svg><span>בחירת הכל</span></button>
      </div>
      <div class="tb-group" id="tb-sel" hidden>
        <button class="tb" id="pg-rotate"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span>סיבוב</span></button>
        <button class="tb" id="pg-delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></svg><span>מחיקה</span></button>
        <button class="tb" id="pg-extract"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M12.5 17.5v-7M9.5 13.5l3-3 3 3"/></svg><span>לקובץ נפרד</span></button>
        <button class="tb" id="pg-clear"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span id="sel-count">ביטול בחירה</span></button>
      </div>
    </nav>
  </section>

  <div class="busy" id="busy" hidden><div class="spinner"></div><p id="busy-text">פותח…</p></div>
  <div class="sheet-root" id="sheet-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="build-info.js"></script>
  <script src="vendor/capacitor.js"></script>
  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/fontkit.umd.min.js"></script>
  <script src="vendor/bidi.min.js"></script>
  <!-- המנוע המשותף עם גרסת Windows (src/core) -->
  <script src="core/hebrew.js"></script>
  <script src="core/textedit.js"></script>
  <script src="core/ops.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
