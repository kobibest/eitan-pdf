<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ניהול איתןPDF</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0B2A82; --deep:#081E63; --royal:#1E4FD6; --wash:#E5EDFD; --gold:#F5B227; --desk:#EEF2F9; --paper:#fff; --ink:#14203A; --ink2:#48557A; --ink3:#7884A3; --line:#DCE3F0; --bad:#C23A2E; --good:#2F7D5B; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans Hebrew','Segoe UI',system-ui,sans-serif; background:var(--desk); color:var(--ink); font-size:15px; line-height:1.55; }
  button, input, textarea, select { font:inherit; }
  :focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .top { background:var(--navy); color:#fff; }
  .top .in { max-width:1280px; margin:0 auto; padding:0 20px; height:58px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand { font-weight:700; font-size:19px; display:flex; align-items:center; gap:9px; }
  .brand img { width:30px; height:30px; } .brand b { color:var(--gold); }
  .brand small { font-weight:500; color:#A9BBE8; font-size:14px; margin-inline-start:6px; }
  main { max-width:1280px; margin:0 auto; padding:22px 20px 60px; }
  .card { background:var(--paper); border-radius:14px; border:1px solid var(--line); padding:22px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:40px; padding:0 16px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink); font-weight:600; cursor:pointer; white-space:nowrap; text-decoration:none; }
  .btn:hover { background:#F6F8FC; }
  .btn:disabled { opacity:.55; cursor:default; }
  .btn-primary { background:var(--royal); border-color:var(--royal); color:#fff; } .btn-primary:hover { background:#163BA8; }
  .btn-gold { background:var(--gold); border-color:#E0A11C; color:var(--deep); } .btn-gold:hover { background:#FFC23D; }
  .btn-ghost-w { background:transparent; color:#fff; border-color:rgba(255,255,255,.35); } .btn-ghost-w:hover { background:rgba(255,255,255,.1); }
  .btn-sm { height:32px; padding:0 10px; font-size:13.5px; }
  .btn-danger { color:var(--bad); }
  .tabs { display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .tab { background:none; border:0; padding:10px 16px; font-weight:600; color:var(--ink2); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-1px; }
  .tab[aria-selected="true"] { color:var(--navy); border-color:var(--royal); }
  .warn { background:#FFF7E3; border:1px solid #F2D79A; color:#6B4E0E; border-radius:10px; padding:12px 16px; margin-bottom:16px; }
  .stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; margin-bottom:16px; }
  .stat { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 18px; }
  .stat b { display:block; font-size:28px; line-height:1.2; color:var(--navy); }
  .stat span { color:var(--ink2); font-size:14px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .toolbar input[type=search] { flex:1; min-width:200px; height:40px; border:1px solid var(--line); border-radius:9px; padding:0 12px; }
  select { height:40px; border:1px solid var(--line); border-radius:9px; padding:0 10px; background:#fff; }
  .tbl-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:right; padding:10px 12px; border-bottom:1px solid #EDF1F8; vertical-align:middle; }
  th { font-size:13px; color:var(--ink3); font-weight:600; }
  td.em { direction:ltr; text-align:right; unicode-bidi:plaintext; }
  td.act { white-space:nowrap; text-align:left; }
  .pill { display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:20px; }
  .pill.ok { background:#E3F3EA; color:var(--good); } .pill.off { background:#F3E5E3; color:var(--bad); }
  .empty { color:var(--ink3); padding:30px; text-align:center; }
  .compose { display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap:20px; align-items:start; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-weight:600; margin-bottom:5px; }
  .field .hint { font-size:13px; color:var(--ink3); margin-top:4px; }
  .field input[type=text], .field input[type=url], .field textarea { width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 12px; background:#fff; }
  .field textarea { min-height:90px; resize:vertical; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .check { display:flex; gap:10px; align-items:flex-start; background:#F6F8FC; border:1px solid var(--line); border-radius:10px; padding:12px; }
  .check input { width:18px; height:18px; margin-top:3px; flex:none; }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .preview { position:sticky; top:16px; }
  .preview .subj { background:#fff; border:1px solid var(--line); border-bottom:0; border-radius:12px 12px 0 0; padding:10px 14px; font-size:14px; }
  .preview .subj b { color:var(--ink3); font-weight:500; }
  .preview iframe { width:100%; height:760px; border:1px solid var(--line); border-radius:0 0 12px 12px; background:var(--desk); display:block; }
  .msg { margin-top:14px; padding:12px 14px; border-radius:10px; display:none; }
  .msg.show { display:block; } .msg.ok { background:#E3F3EA; color:#1F5A40; } .msg.err { background:#F8E7E5; color:#8A2A21; }
  .login { max-width:440px; margin:60px auto; text-align:center; }
  .login h1 { margin:0 0 8px; font-size:24px; }
  .login p { color:var(--ink2); margin:0 0 18px; }
  dialog { border:0; border-radius:14px; padding:0; width:min(560px, calc(100vw - 32px)); box-shadow:0 30px 80px -20px rgba(0,0,0,.45); }
  dialog::backdrop { background:rgba(8,30,99,.45); }
  .dlg { padding:22px; }
  .dlg h2 { margin:0 0 12px; font-size:19px; direction:ltr; text-align:right; unicode-bidi:plaintext; }
  .dlg dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; }
  .dlg dt { color:var(--ink3); } .dlg dd { margin:0; word-break:break-word; }
  .dlg .quote { background:#F6F8FC; border-inline-start:3px solid var(--royal); padding:8px 12px; border-radius:6px; margin-top:4px; }
  .hidden { display:none !important; }
  @media (max-width: 960px) { .compose { grid-template-columns:1fr; } .preview { position:static; } .preview iframe { height:600px; } }
  @media (max-width: 600px) { .stats { grid-template-columns:1fr 1fr; } .row2 { grid-template-columns:1fr; } main { padding:16px 16px 40px; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><img src="/logo.png" alt=""><span>איתן<b>PDF</b></span><small>אזור ניהול</small></div>
  <button class="btn btn-sm btn-ghost-w hidden" id="logout">יציאה</button>
</div></header>

<main>
  <section id="loginView" class="card login hidden">
    <h1>כניסה לאזור הניהול</h1>
    <p>נשלח קישור כניסה חד-פעמי למייל של מנהל האתר. הקישור תקף ל-15 דקות.</p>
    <button class="btn btn-primary" id="loginBtn">שלחו לי קישור כניסה</button>
    <div class="msg" id="loginMsg"></div>
  </section>

  <section id="app" class="hidden">
    <div id="warnings"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="subs">נרשמים</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="compose">שליחת עדכון גרסה</button>
    </div>

    <div id="tab-subs">
      <div class="stats">
        <div class="stat"><b id="nActive">–</b><span>רשומים פעילים</span></div>
        <div class="stat"><b id="nRemoved">–</b><span>הסירו את עצמם</span></div>
        <div class="stat"><b id="nWeek">–</b><span>נרשמו ב-7 הימים האחרונים</span></div>
      </div>
      <div class="card">
        <div class="toolbar">
          <input type="search" id="q" placeholder="חיפוש לפי מייל או שם" aria-label="חיפוש">
          <select id="view" aria-label="איזו רשימה">
            <option value="active">רשומים פעילים</option>
            <option value="removed">הוסרו</option>
          </select>
          <button class="btn" id="refresh">רענון</button>
          <button class="btn" id="csv">ייצוא ל-CSV</button>
        </div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>מייל</th><th>שם</th><th>תאריך הצטרפות</th><th>מצב</th><th></th></tr></thead>
            <tbody id="rows"><tr><td colspan="5" class="empty">טוען…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="tab-compose" class="hidden">
      <div class="compose">
        <form class="card" id="form" autocomplete="off">
          <div class="actions" style="margin:0 0 16px">
            <button type="button" class="btn" id="fromGh">מילוי מהגרסה האחרונה ב-GitHub</button>
            <button type="button" class="btn" id="clearForm">ניקוי</button>
          </div>
          <div class="row2">
            <div class="field"><label for="f-version">מספר גרסה</label><input type="text" id="f-version" name="version" placeholder="1.3.0" dir="ltr"></div>
            <div class="field"><label for="f-ctaText">טקסט הכפתור</label><input type="text" id="f-ctaText" name="ctaText" placeholder="להורדת הגרסה החדשה"></div>
          </div>
          <div class="field"><label for="f-subject">שורת נושא</label><input type="text" id="f-subject" name="subject" placeholder="איתןPDF 1.3.0 זמינה להורדה"><div class="hint">ריק = נוצר אוטומטית ממספר הגרסה.</div></div>
          <div class="field"><label for="f-headline">כותרת במייל</label><input type="text" id="f-headline" name="headline" placeholder="גרסה 1.3.0 של איתןPDF זמינה להורדה"></div>
          <div class="field"><label for="f-intro">פתיח</label><textarea id="f-intro" name="intro" placeholder="כמה מילים על הגרסה. שורה ריקה = פסקה חדשה."></textarea></div>
          <div class="field"><label for="f-changes">מה חדש</label><textarea id="f-changes" name="changes" style="min-height:140px" placeholder="שינוי אחד בכל שורה"></textarea><div class="hint">כל שורה תופיע כנקודה עם ✓.</div></div>
          <div class="field"><label for="f-extra">טקסט נוסף (אחרי הרשימה)</label><textarea id="f-extra" name="extra" placeholder="לא חובה"></textarea></div>
          <div class="field"><label for="f-ctaUrl">קישור הכפתור</label><input type="url" id="f-ctaUrl" name="ctaUrl" placeholder="https://pdf.m-eitan.co.il/download" dir="ltr"><div class="hint">ריק = קישור ההורדה של הגרסה האחרונה.</div></div>
          <label class="check"><input type="checkbox" id="f-markAd" name="markAd" checked>
            <span><b>להוסיף "פרסומת:" בתחילת שורת הנושא</b><br><span style="color:var(--ink2);font-size:13.5px">חוק התקשורת (סעיף 30א) מחייב זאת בכל "דבר פרסומת". עדכון על תוכנה חינמית כנראה אינו פרסומת, אבל כל עוד המייל מפנה לאתר שלכם, ההמלצה היא להשאיר מסומן. בטלו רק אם אתם בטוחים שהתוכן אינו שיווקי.</span></span>
          </label>
          <div class="actions">
            <button type="button" class="btn" id="testBtn">שליחת בדיקה אליי</button>
            <button type="button" class="btn btn-gold" id="sendBtn">שליחה לכל הנרשמים</button>
          </div>
          <div class="msg" id="sendMsg"></div>
        </form>
        <div class="preview">
          <div class="subj"><b>נושא:</b> <span id="pvSubject">…</span></div>
          <iframe id="pv" title="תצוגה מקדימה של המייל" sandbox></iframe>
        </div>
      </div>
    </div>
  </section>
</main>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const slug = location.pathname.split('/').filter(Boolean).pop();
  let data = { active: [], removed: [] };
  let campaignId = newId();

  function newId() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10); }
  async function api(action, body) {
    const r = await fetch('/api/admin?action=' + action, {
      method: action === 'me' ? 'GET' : 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Eitan-Admin': '1' },
      credentials: 'same-origin',
      body: action === 'me' ? undefined : JSON.stringify({ action, ...(body || {}) }),
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { showLogin(); throw new Error(j.error || 'צריך להתחבר'); }
    if (!r.ok) throw new Error(j.error || ('שגיאה ' + r.status));
    return j;
  }
  function msg(el, text, ok) { el.textContent = text; el.className = 'msg show ' + (ok ? 'ok' : 'err'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function fmtDate(s) { if (!s || s === '-') return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('he-IL', { dateStyle: 'short', timeStyle: 'short' }); }

  function showLogin() { $('#loginView').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#logout').classList.add('hidden'); }
  function showApp() { $('#loginView').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#logout').classList.remove('hidden'); }
  function showWarnings(w) { $('#warnings').innerHTML = (w || []).map((x) => '<div class="warn">' + esc(x) + '</div>').join(''); }

  $('#loginBtn').onclick = async () => {
    const b = $('#loginBtn'); b.disabled = true;
    try {
      const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', slug }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'שגיאה');
      msg($('#loginMsg'), 'נשלח קישור כניסה אל ' + j.to + '. פתחו אותו בדפדפן הזה.', true);
    } catch (e) { msg($('#loginMsg'), e.message, false); b.disabled = false; }
  };
  $('#logout').onclick = async () => { await api('logout').catch(() => {}); showLogin(); };

  // ---------- לשוניות ----------
  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', x === t));
    $('#tab-subs').classList.toggle('hidden', t.dataset.tab !== 'subs');
    $('#tab-compose').classList.toggle('hidden', t.dataset.tab !== 'compose');
    if (t.dataset.tab === 'compose') refreshPreview();
  });

  // ---------- נרשמים ----------
  async function load() {
    $('#rows').innerHTML = '<tr><td colspan="5" class="empty">טוען…</td></tr>';
    try {
      data = await api('list');
      showWarnings(data.warnings);
      const weekAgo = Date.now() - 7 * 864e5;
      $('#nActive').textContent = data.active.filter((p) => !p.blocked).length;
      $('#nRemoved').textContent = data.removed.length;
      $('#nWeek').textContent = data.active.filter((p) => new Date(p.created_at) > weekAgo).length;
      updateSendLabel();
      render();
    } catch (e) { $('#rows').innerHTML = '<tr><td colspan="5" class="empty">' + esc(e.message) + '</td></tr>'; }
  }
  function currentRows() {
    const list = data[$('#view').value] || [];
    const q = $('#q').value.trim().toLowerCase();
    return list.filter((p) => !q || p.email.toLowerCase().includes(q) || (p.name || '').toLowerCase().includes(q))
      .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  }
  function render() {
    const view = $('#view').value; const rows = currentRows();
    if (!rows.length) { $('#rows').innerHTML = '<tr><td colspan="5" class="empty">' + (view === 'active' ? 'עוד אין נרשמים.' : 'אף אחד לא הוסר.') + '</td></tr>'; return; }
    $('#rows').innerHTML = rows.map((p) => `<tr>
      <td class="em">${esc(p.email)}</td><td>${esc(p.name)}</td><td>${fmtDate(p.created_at)}</td>
      <td>${view === 'removed' ? '<span class="pill off">הוסר</span>' : p.blocked ? '<span class="pill off" title="המנוי בוטל ברמת חשבון הריסנד כולו">חסום</span>' : '<span class="pill ok">פעיל</span>'}</td>
      <td class="act"><button class="btn btn-sm" data-act="info" data-id="${p.id}">פרטים</button>
        ${view === 'active' ? `<button class="btn btn-sm" data-act="remove" data-id="${p.id}">הסרה</button>` : ''}
        <button class="btn btn-sm btn-danger" data-act="delete" data-id="${p.id}">מחיקה</button></td></tr>`).join('');
  }
  $('#q').oninput = render; $('#view').onchange = render; $('#refresh').onclick = load;
  $('#rows').onclick = async (ev) => {
    const b = ev.target.closest('button[data-act]'); if (!b) return;
    const id = b.dataset.id; const p = [...data.active, ...data.removed].find((x) => x.id === id);
    if (b.dataset.act === 'info') return info(id);
    if (b.dataset.act === 'remove') {
      if (!confirm('להסיר את ' + p.email + ' מרשימת התפוצה?\nהוא לא יקבל יותר עדכונים. הרישום נשמר ברשימת "הוסרו" לתיעוד.')) return;
    } else if (!confirm('למחוק לגמרי את ' + p.email + '?\nכל הפרטים, כולל תיעוד ההסכמה, יימחקו. מתאים לבקשת מחיקה לפי חוק הגנת הפרטיות.')) return;
    b.disabled = true;
    try { await api(b.dataset.act, { id }); await load(); } catch (e) { alert(e.message); b.disabled = false; }
  };
  async function info(id) {
    const d = $('#dlg'); $('#dlgBody').innerHTML = '<p>טוען…</p>'; d.showModal();
    try {
      const c = await api('contact', { id });
      const st = { active: 'פעיל', removed: 'הוסר', none: 'לא ברשימה' }[c.status];
      $('#dlgBody').innerHTML = `<h2>${esc(c.email)}</h2><dl>
        <dt>שם</dt><dd>${esc(c.name) || '—'}</dd>
        <dt>מצב</dt><dd>${st}${c.blocked ? ' (חסום ברמת החשבון)' : ''}</dd>
        <dt>מועד ההסכמה</dt><dd>${esc(fmtDate(c.consent.at)) || '—'}</dd>
        <dt>מקור</dt><dd>${esc(c.consent.source) || '—'}</dd>
        <dt>כתובת IP</dt><dd dir="ltr" style="text-align:right">${esc(c.consent.ip) || '—'}</dd>
        <dt>נוסח שאושר</dt><dd>${esc(c.consent.version) || '—'}${c.consent.text ? '<div class="quote">' + esc(c.consent.text) + '</div>' : ''}</dd>
        ${c.unsubscribed_at && c.unsubscribed_at !== '-' ? `<dt>הוסר</dt><dd>${esc(c.unsubscribed_at)}</dd>` : ''}
      </dl><div class="actions"><button class="btn" onclick="this.closest('dialog').close()">סגירה</button></div>`;
    } catch (e) { $('#dlgBody').innerHTML = '<p>' + esc(e.message) + '</p>'; }
  }
  $('#csv').onclick = () => {
    const rows = currentRows();
    const head = ['email', 'name', 'created_at', 'status'];
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const csv = '﻿' + [head.join(','), ...rows.map((p) => [p.email, p.name, p.created_at, $('#view').value].map(q).join(','))].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'eitanpdf-' + $('#view').value + '-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  // ---------- שליחת עדכון ----------
  const form = $('#form');
  const DRAFT = 'eitanpdf-draft';
  function campaign() {
    const f = new FormData(form); const o = {};
    for (const [k, v] of f.entries()) o[k] = v;
    o.markAd = $('#f-markAd').checked;
    return o;
  }
  function fill(o) {
    for (const [k, v] of Object.entries(o || {})) { const el = form.elements[k]; if (!el) continue; if (el.type === 'checkbox') el.checked = v !== false; else el.value = v; }
  }
  try { fill(JSON.parse(localStorage.getItem(DRAFT) || '{}')); } catch {}
  let t;
  form.addEventListener('input', () => {
    campaignId = newId();
    try { localStorage.setItem(DRAFT, JSON.stringify(campaign())); } catch {}
    clearTimeout(t); t = setTimeout(refreshPreview, 450);
  });
  async function refreshPreview() {
    try { const r = await api('preview', { campaign: campaign() }); $('#pvSubject').textContent = r.subject; $('#pv').srcdoc = r.html; } catch (e) { $('#pvSubject').textContent = e.message; }
  }
  function updateSendLabel() {
    const n = data.active.filter((p) => !p.blocked).length;
    $('#sendBtn').textContent = 'שליחה לכל הנרשמים (' + n + ')';
  }
  $('#clearForm').onclick = () => { if (!confirm('לנקות את הטופס?')) return; form.reset(); try { localStorage.removeItem(DRAFT); } catch {} campaignId = newId(); refreshPreview(); };
  $('#fromGh').onclick = async () => {
    try {
      const r = await fetch('https://api.github.com/repos/kobibest/eitan-pdf/releases/latest', { headers: { Accept: 'application/vnd.github+json' } });
      if (!r.ok) throw new Error('GitHub החזיר ' + r.status);
      const rel = await r.json();
      const v = String(rel.tag_name || '').replace(/^v/, '');
      const lines = String(rel.body || '').split(/\r?\n/).map((l) => l.trim()).filter((l) => /^[-*•]\s+/.test(l)).map((l) => l.replace(/^[-*•]\s+/, '').replace(/\*\*|__|`/g, ''));
      fill({ version: v, changes: lines.join('\n') || form.elements.changes.value });
      form.dispatchEvent(new Event('input'));
    } catch (e) { msg($('#sendMsg'), 'לא הצלחתי לקרוא מ-GitHub: ' + e.message, false); }
  };
  $('#testBtn').onclick = async () => {
    const b = $('#testBtn'); b.disabled = true;
    try { const r = await api('test', { campaign: campaign() }); msg($('#sendMsg'), 'מייל בדיקה נשלח אל ' + r.to + '.', true); }
    catch (e) { msg($('#sendMsg'), e.message, false); }
    b.disabled = false;
  };
  $('#sendBtn').onclick = async () => {
    const c = campaign();
    if (!c.version && !c.headline) return msg($('#sendMsg'), 'צריך למלא לפחות מספר גרסה או כותרת.', false);
    const n = data.active.filter((p) => !p.blocked).length;
    if (!n) return msg($('#sendMsg'), 'אין עדיין נרשמים פעילים.', false);
    if (!confirm('לשלוח את המייל ל-' + n + ' נרשמים?\nאי אפשר לבטל אחרי השליחה. מומלץ לשלוח קודם בדיקה אליכם.')) return;
    const b = $('#sendBtn'); b.disabled = true; b.textContent = 'שולח…';
    try {
      const r = await api('send', { campaign: c, campaignId });
      msg($('#sendMsg'), 'נשלח ל-' + r.sent + ' מתוך ' + r.total + ' נרשמים.' + (r.errors.length ? ' שגיאות: ' + r.errors.join(' | ') : ' סיכום נשלח גם למייל שלכם.'), !r.errors.length);
    } catch (e) { msg($('#sendMsg'), e.message, false); }
    b.disabled = false; updateSendLabel();
  };

  // ---------- התחלה ----------
  api('me').then((r) => { showWarnings(r.warnings); if (r.admin) { showApp(); load(); } else showLogin(); }).catch(() => showLogin());
})();
</script>
</body>
</html>
