<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הסרה מרשימת התפוצה — איתןPDF</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0B2A82; --gold:#F5B227; --ink:#14203A; --ink2:#48557A; --desk:#DCE4F1; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; font-family:'IBM Plex Sans Hebrew','Segoe UI',system-ui,sans-serif; background:var(--desk); color:var(--ink); line-height:1.65; font-size:17px; }
  header { background:var(--navy); padding:16px 20px; }
  header a { color:#fff; text-decoration:none; font-weight:700; font-size:20px; display:inline-flex; gap:10px; align-items:center; }
  header img { width:32px; height:32px; } header b { color:var(--gold); }
  main { flex:1; display:grid; place-items:center; padding:32px 16px; }
  .card { background:#fff; border-radius:16px; padding:34px 30px; max-width:520px; width:100%; box-shadow:0 18px 40px -16px rgba(11,30,90,.38); text-align:center; }
  h1 { margin:0 0 10px; font-size:26px; line-height:1.3; }
  p { margin:0 0 12px; color:var(--ink2); }
  .em { direction:ltr; unicode-bidi:isolate; font-weight:600; color:var(--ink); }
  .ic { width:56px; height:56px; border-radius:50%; display:grid; place-items:center; margin:0 auto 16px; font-size:28px; font-weight:700; }
  .ok .ic { background:#E3F3EA; color:#2F7D5B; } .err .ic { background:#F8E7E5; color:#C23A2E; } .wait .ic { background:#E5EDFD; color:var(--navy); }
  a { color:#1E4FD6; }
  .btn { display:inline-block; margin-top:8px; background:var(--gold); color:#081E63; font-weight:700; padding:11px 22px; border-radius:10px; text-decoration:none; }
</style>
</head>
<body>
<header><a href="/"><img src="logo.png" alt="" width="32" height="32"><span>איתן<b>PDF</b></span></a></header>
<main>
  <div class="card wait" id="card" role="status" aria-live="polite">
    <div class="ic" id="ic">…</div>
    <h1 id="title">מסירים אתכם מהרשימה…</h1>
    <p id="text">רק רגע.</p>
  </div>
</main>
<script>
  (async () => {
    const p = new URLSearchParams(location.search);
    const set = (cls, ic, title, html) => {
      document.getElementById('card').className = 'card ' + cls;
      document.getElementById('ic').textContent = ic;
      document.getElementById('title').textContent = title;
      document.getElementById('text').innerHTML = html;
    };
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    if (!p.get('e') || !p.get('t')) {
      return set('err', '!', 'הקישור לא שלם', 'כדי להסיר את עצמכם, לחצו על קישור ההסרה שבתחתית המייל, או פשוט השיבו לכל מייל שקיבלתם מאיתנו וכתבו "הסר". אפשר גם לכתוב ל-<a href="mailto:kobi@eitan-m.co.il?subject=הסרה מרשימת התפוצה">kobi@eitan-m.co.il</a>.');
    }
    try {
      const r = await fetch('/api/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ e: p.get('e'), t: p.get('t') }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'ההסרה לא הצליחה.');
      try { localStorage.removeItem('eitanpdf-subscribed'); } catch (e) {}
      set('ok', '✓', 'הוסרתם מרשימת התפוצה', 'הכתובת <span class="em">' + esc(j.email) + '</span> לא תקבל מאיתנו יותר מיילים על עדכונים.<br>התוכנה עצמה ממשיכה לעבוד כרגיל, ותמיד אפשר להוריד את הגרסה האחרונה מהאתר.<br><a class="btn" href="/">לאתר איתןPDF</a>');
    } catch (e) {
      set('err', '!', 'ההסרה לא הצליחה', esc(e.message) + '<br>אפשר להשיב לכל מייל שקיבלתם ולכתוב "הסר", או לכתוב ל-<a href="mailto:kobi@eitan-m.co.il?subject=הסרה מרשימת התפוצה">kobi@eitan-m.co.il</a>, ונסיר אתכם ידנית.');
    }
  })();
</script>
</body>
</html>
