<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' data: blob:">
  <title>PDF עברית</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="PDF עברית">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M7 3h13l6 6v20H7z" fill="#fff" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M20 3v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M11.5 22c2.2-4.5 3.5-6.8 4.3-6.6.9.2-.6 5.1.3 5.3.8.2 2-3 2.8-2.8.6.1.3 1.9 1.6 2.1" fill="none" stroke="var(--ink-blue)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">PDF <b>עברית</b></span>
    </div>

    <nav class="views" role="tablist" aria-label="מצבי עבודה">
      <button role="tab" data-view="organize" aria-selected="true">ארגון עמודים</button>
      <button role="tab" data-view="edit">חתימה ומילוי</button>
      <button role="tab" data-view="split">פיצול</button>
      <button role="tab" data-view="extras">סימן מים ומספור</button>
      <button role="tab" data-view="folder">תיקיית קבצים</button>
    </nav>

    <div class="top-actions">
      <button class="icon-btn" id="btn-undo" title="ביטול (Ctrl+Z)" aria-label="ביטול">
        <svg viewBox="0 0 24 24"><path d="M14 7h-7l3-3M7 7l3 3"/><path d="M7 7h7a5 5 0 0 1 0 10h-3"/></svg>
      </button>
      <button class="icon-btn" id="btn-redo" title="ביצוע מחדש (Ctrl+Y)" aria-label="ביצוע מחדש">
        <svg viewBox="0 0 24 24"><path d="M10 7h7l-3-3M17 7l-3 3"/><path d="M17 7h-7a5 5 0 0 0 0 10h3"/></svg>
      </button>
      <button class="btn btn-quiet" id="btn-open">פתיחת קבצים</button>
      <button class="btn btn-primary" id="btn-save" disabled>שמירת PDF</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel" id="panel"></aside>
    <section class="desk" id="desk" tabindex="-1"></section>
  </main>

  <div class="drop-veil" id="drop-veil" hidden>
    <div class="drop-sheet">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 6h18l8 8v28H12z"/><path d="M30 6v8h8"/><path d="M25 20v14M19 28l6 6 6-6"/></svg>
      <p>שחררו כאן כדי להוסיף את הקבצים</p>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modal-root"></div>

  <script src="../../node_modules/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="../../node_modules/@pdf-lib/fontkit/dist/fontkit.umd.min.js"></script>
  <script src="../../node_modules/bidi-js/dist/bidi.min.js"></script>
  <script src="../core/hebrew.js"></script>
  <script src="../core/ops.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
